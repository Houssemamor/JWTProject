<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Register</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container" style="max-width: 620px; margin-top: 40px;">
        <div class="card">
            <div class="card-body">
                <h3 class="mb-4">Register</h3>

                <div th:if="${registerError}" class="alert alert-danger" th:text="${registerError}"></div>

                <form th:action="@{/register}" th:object="${registerForm}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input id="username" type="text" class="form-control" th:field="*{username}" required>
                        <small class="text-danger" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></small>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input id="email" type="email" class="form-control" th:field="*{email}" required>
                        <small class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></small>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input id="password" type="password" class="form-control" th:field="*{password}" required>
                        <small class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></small>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">Create account</button>
                </form>

                <hr>
                <div>
                    <a th:href="@{/login}">Back to login</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
